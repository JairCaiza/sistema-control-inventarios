services:
  # =========================================================
  # PostgreSQL
  # =========================================================
  postgres:
    image: postgres:15
    container_name: sistema-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # =========================================================
  # Backend Node.js + Express
  # =========================================================
  backend:
    build:
      context: ./back

    container_name: sistema-backend

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      # Servidor
      PORT: 3000

      # PostgreSQL
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSL: "false"

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}

      # Administrador inicial
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:-Administrador}
      ADMIN_APELLIDO: ${ADMIN_APELLIDO:-Sistema}

    ports:
      - "3001:3000"

  # =========================================================
  # Frontend React + Nginx
  # =========================================================
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}

    container_name: sistema-frontend

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "8080:80"

# =========================================================
# Volúmenes
# =========================================================
volumes:
  postgres_data:
